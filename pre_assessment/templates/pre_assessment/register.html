{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Registration - Atom Shaale</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
  
  <style nonce="{{ request.csp_nonce }}">
    :root {
      --primary-color: #004d20;
      --secondary-color: #008037;
      --pill-bg: #e6f6ec;
      --pill-text: #00702e;
      --text-dark: #1e293b;
      --text-grey: #64748b;
      --font-family: 'Century Gothic';
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Decorative circles */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
      filter: blur(40px);
    }
    .circle-1 {
      top: -10%;
      left: -10%;
      width: 40vw;
      height: 40vw;
      background: rgba(0, 128, 55, 0.15);
    }
    .circle-2 {
      bottom: -10%;
      right: -10%;
      width: 35vw;
      height: 35vw;
      background: rgba(0, 77, 32, 0.15);
    }

    .register-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(0, 77, 32, 0.08);
      z-index: 5;
      position: relative;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-container {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-container img {
      max-height: 80px;
      width: auto;
      object-fit: contain;
    }

    .card-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .card-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 8px;
    }
    .card-header p {
      font-size: 0.9rem;
      color: var(--text-grey);
    }

    .exam-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--pill-bg);
      color: var(--pill-text);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 20px;
      align-self: center;
      letter-spacing: 0.5px;
    }

    .error-msg {
      background: #fee2e2;
      border-left: 4px solid #ef4444;
      color: #b91c1c;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-grey);
      font-size: 0.95rem;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px 12px 38px;
      font-size: 0.9rem;
      font-family: inherit;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      background: white;
      color: var(--text-dark);
      transition: all 0.2s ease;
      outline: none;
    }
    .form-control:focus {
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 3px rgba(0, 128, 55, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 16px rgba(0, 77, 32, 0.15);
      transition: all 0.2s ease;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: #003314;
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(0, 77, 32, 0.25);
    }
    .btn-submit:active {
      transform: translateY(0);
    }

    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-grey);
      margin-top: 24px;
    }
    .footer-note a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="bg-circle circle-1"></div>
  <div class="bg-circle circle-2"></div>

  <div class="register-card">
    <div class="logo-container">
      <img src="{% static 'images/atomshaalelogo.png' %}" alt="Atom Shaale Logo">
    </div>
    
    <div class="card-header">
      <h2>PRE-Assessment Entrance</h2>
      <p>Please enter your details to register and begin the assessment.</p>
    </div>

    <center>
      <div class="exam-badge">
        <i class="fa-regular fa-file-lines"></i> {{ pre_exam.exam.title }}
      </div>
    </center>

    {% if error %}
      <div class="error-msg">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form method="post" action="{% url 'pre_assessment_register' pre_exam.code %}">
      {% csrf_token %}
      
      <div class="form-group">
        <label for="name">Full Name <span style="color: #ef4444;">*</span></label>
        <div class="input-wrapper">
          <i class="fa-regular fa-user input-icon"></i>
          <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required autocomplete="name">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address <span style="color: #ef4444;">*</span></label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope input-icon"></i>
          <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email address" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="usn">USN / Register Number <span style="color: #ef4444;">*</span></label>
        <div class="input-wrapper">
          <i class="fa-regular fa-id-card input-icon"></i>
          <input type="text" id="usn" name="usn" class="form-control" placeholder="Enter your USN" required autocomplete="off">
        </div>
      </div>

      <div class="form-group">
        <label for="college">College Name <span style="color: #ef4444;">*</span></label>
        <div class="input-wrapper">
          <i class="fa-solid fa-building-columns input-icon"></i>
          <select id="college" name="college" class="form-control" style="padding-left: 38px;" required>
            <option value="" disabled selected>Select College</option>
            {% for c in colleges %}
              <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="course">Course / Department <span style="color: #ef4444;">*</span></label>
        <div class="input-wrapper">
          <i class="fa-solid fa-graduation-cap input-icon"></i>
          <select id="course" name="course" class="form-control" style="padding-left: 38px;" required disabled>
            <option value="" disabled selected>--Select College First--</option>
          </select>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label for="year">Year <span style="color: #ef4444;">*</span></label>
          <div class="input-wrapper">
            <i class="fa-regular fa-calendar input-icon"></i>
            <select id="year" name="year" class="form-control" style="padding-left: 38px;" required>
              <option value="" disabled selected>Select Year</option>
              <option value="1">1st Year</option>
              <option value="2">2nd Year</option>
              <option value="3">3rd Year</option>
              <option value="4">4th Year</option>
              <option value="5">5th Year</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="sem">Semester <span style="color: #ef4444;">*</span></label>
          <div class="input-wrapper">
            <i class="fa-solid fa-book-open input-icon"></i>
            <select id="sem" name="sem" class="form-control" style="padding-left: 38px;" required>
              <option value="" disabled selected>Select Sem</option>
              <option value="1">1st Sem</option>
              <option value="2">2nd Sem</option>
              <option value="3">3rd Sem</option>
              <option value="4">4th Sem</option>
              <option value="5">5th Sem</option>
              <option value="6">6th Sem</option>
              <option value="7">7th Sem</option>
              <option value="8">8th Sem</option>
            </select>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <span>Proceed to Exam</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="footer-note">
      Powered by <a href="/">ATOM Shaale</a>
    </div>
  </div>

  <script nonce="{{ request.csp_nonce }}">
    document.addEventListener("DOMContentLoaded", () => {
      const collegeSelect = document.getElementById("college");
      const courseSelect = document.getElementById("course");

      if (collegeSelect && courseSelect) {
        collegeSelect.addEventListener("change", async () => {
          const collegeId = collegeSelect.value;
          if (!collegeId) {
            courseSelect.disabled = true;
            courseSelect.innerHTML = '<option value="" disabled selected>--Select College First--</option>';
            return;
          }

          courseSelect.disabled = true;
          courseSelect.innerHTML = '<option value="" disabled selected>Loading courses...</option>';

          try {
            const res = await fetch(`/college/courses/api/list/?college_id=${collegeId}`);
            const courses = await res.json();

            courseSelect.innerHTML = '<option value="" disabled selected>Select Course</option>';
            courses.forEach(c => {
              courseSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
            });
            courseSelect.disabled = false;
          } catch (err) {
            console.error("Error loading courses:", err);
            courseSelect.innerHTML = '<option value="" disabled selected>Error loading courses</option>';
          }
        });
      }
    });
  </script>

</body>
</html>
