{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Submitted - Atom Shaale</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
  
  <style nonce="{{ request.csp_nonce }}">
    :root {
      --primary-color: #004d20;
      --secondary-color: #008037;
      --font-family: 'Century Gothic';
    }   

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .success-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 24px;
      padding: 50px 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(0, 77, 32, 0.08);
      text-align: center;
      z-index: 5;
      animation: zoomIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .success-icon-wrapper {
      width: 80px;
      height: 80px;
      background: #dcfce7;
      color: var(--secondary-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 24px auto;
      box-shadow: 0 8px 20px rgba(0, 128, 55, 0.15);
      animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.5);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 12px;
    }

    p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .countdown-box {
      background: #f1f5f9;
      padding: 10px 16px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 24px;
    }
    
    .countdown-number {
      color: var(--secondary-color);
      font-weight: 800;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: var(--primary-color);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 8px 16px rgba(0, 77, 32, 0.15);
      transition: all 0.2s ease;
    }
    .btn-home:hover {
      background: #003314;
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(0, 77, 32, 0.25);
    }
    .btn-home:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="success-card">
    <div class="success-icon-wrapper">
      <i class="fa-solid fa-circle-check"></i>
    </div>
    
    <h1>Assessment Submitted!</h1>
    <p>Thank you for completing <strong>{{ pre_exam.exam.title }}</strong>. Your responses have been recorded successfully.</p>
    
    <div class="countdown-box">
      <i class="fa-regular fa-clock"></i>
      <span>Redirecting to homepage in <span id="countdown" class="countdown-number">5</span> seconds...</span>
    </div>
    
    <div>
      <a href="/" class="btn-home">
        <i class="fa-solid fa-house"></i>
        <span>Return Immediately</span>
      </a>
    </div>
  </div>

  <script nonce="{{ request.csp_nonce }}">
    document.addEventListener('DOMContentLoaded', function() {
      let seconds = 5;
      const display = document.getElementById('countdown');
      
      const interval = setInterval(function() {
        seconds--;
        if (display) {
          display.textContent = seconds;
        }
        if (seconds <= 0) {
          clearInterval(interval);
          window.location.href = '/';
        }
      }, 1000);
    });
  </script>
</body>
</html>
