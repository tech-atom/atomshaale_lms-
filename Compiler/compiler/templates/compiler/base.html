<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jango Compiler{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Courier New', monospace;
        }
        
        .navbar {
            background-color: #008037 !important;
            border-bottom: 2px solid #005024;
        }
        
        .navbar-brand {
            color: #ffffff !important;
            font-weight: bold;
        }
        
        .nav-link {
            color: #ffffff !important;
        }
        
        .nav-link:hover {
            color: #e6e6e6 !important;
            background-color: #005024;
            border-radius: 5px;
        }
        
        .container-fluid {
            padding-top: 20px;
        }
        
        .card {
            background-color: #2d2d2d;
            border: 1px solid #008037;
            margin-bottom: 20px;
        }
        
        .card-header {
            background-color: #008037;
            color: white;
            font-weight: bold;
        }
        
        .btn-primary {
            background-color: #008037;
            border-color: #008037;
        }
        
        .btn-primary:hover {
            background-color: #005024;
            border-color: #005024;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'compiler:dashboard' %}">
                <i class="fas fa-code"></i> Jango Compiler
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'compiler:dashboard' %}">
                            <i class="fas fa-home"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'compiler:editor' %}">
                            <i class="fas fa-edit"></i> Code Editor
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'compiler:installation_guide' %}">
                            <i class="fas fa-download"></i> Setup Guide
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
