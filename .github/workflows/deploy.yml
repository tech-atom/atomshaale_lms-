name: Production Zero-Downtime Multi-Server Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy across All Servers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "============================================="
            echo "1. UPDATING BASE SERVER (atom-lms-app-server)"
            echo "============================================="
            cd /opt/atomm_lms
            git config --global --add safe.directory /opt/atomm_lms
            git fetch origin main
            git reset --hard origin/main
            
            echo "Applying Database Migrations..."
            sudo docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.override.yml exec -T web python manage.py migrate --noinput
            
            echo "Collecting and Syncing Static Files..."
            sudo docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.override.yml exec -T web python manage.py collectstatic --noinput
            sudo cp -r /opt/atomm_lms/static/* /opt/atomm_lms/staticfiles/ 2>/dev/null || true
            sudo systemctl reload nginx
            
            echo "Building and Updating Web Container..."
            sudo docker compose --parallel 1 --env-file .env.production -f docker-compose.production.yml -f docker-compose.override.yml build web celery-email celery-compiler compiler-sandbox
            sudo docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.override.yml up -d web celery-email celery-compiler
            echo "Verifying Celery Redis transport against the deployed broker..."
            sudo docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.override.yml exec -T web python -c 'import celery, kombu, redis; from atomm_lms.celery import app; c = app.connection_for_write(); c.ensure_connection(max_retries=1); ch = c.channel(); ch.close(); c.release(); print(f"celery={celery.__version__}, kombu={kombu.__version__}, redis={redis.__version__}")'
            echo "Verifying Java compile and runtime in the deployed web container..."
            sudo docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.override.yml exec -T web sh -ec 'command -v javac && javac -version && command -v java && java -version && d=$(mktemp -d) && printf "%s\n" "public class Main { public static void main(String[] args) { System.out.println(3); } }" > "$d/Main.java" && javac "$d/Main.java" && test "$(java -cp "$d" Main)" = 3 && rm -rf "$d"'
            echo "Verifying Java compile and runtime in the isolated compiler image..."
            sudo docker run --rm --network none --read-only --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit 64 --memory 256m --memory-swap 256m --cpus 0.5 --tmpfs /tmp:rw,noexec,nosuid,size=64m --tmpfs /workspace:rw,nosuid,size=64m,uid=1000,gid=1000,mode=700 --entrypoint sh atomm-lms-compiler-sandbox:latest -ec 'command -v javac && javac -version && command -v java && java -version && d=$(mktemp -d /workspace/java-smoke.XXXXXX) && printf "%s\n" "public class Main { public static void main(String[] args) { System.out.println(3); } }" > "$d/Main.java" && javac "$d/Main.java" && test "$(java -cp "$d" Main)" = 3 && rm -rf "$d"'

            echo "============================================="
            echo "2. UPDATING RUNNING AUTO-SCALING WORKERS"
            echo "============================================="
            WORKER_IPS=$(aws ec2 describe-instances --region ap-south-1 --filters "Name=tag:aws:autoscaling:groupName,Values=atom-lms-asg" "Name=instance-state-name,Values=running" --query "Reservations[*].Instances[*].PrivateIpAddress" --output text)

            if [ -n "$WORKER_IPS" ] && [ "$WORKER_IPS" != "None" ]; then
              for IP in $WORKER_IPS; do
                echo "--> Updating Worker: $IP"
                ssh -o StrictHostKeyChecking=no ubuntu@$IP "set -e; cd /opt/atomm_lms; git fetch origin main; git reset --hard origin/main; sudo cp -r /opt/atomm_lms/static/* /opt/atomm_lms/staticfiles/ 2>/dev/null || true; sudo systemctl reload nginx; sudo docker compose --parallel 1 --env-file .env.production -f docker-compose.production.yml -f docker-compose.override.yml build web celery-email celery-compiler compiler-sandbox; sudo docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.override.yml up -d web celery-email celery-compiler; sudo docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.override.yml exec -T web python -c 'import celery, kombu, redis; from atomm_lms.celery import app; c = app.connection_for_write(); c.ensure_connection(max_retries=1); ch = c.channel(); ch.close(); c.release(); print(f\"celery={celery.__version__}, kombu={kombu.__version__}, redis={redis.__version__}\")'; sudo docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.override.yml exec -T web sh -ec 'command -v javac && javac -version && command -v java && java -version && d=\$(mktemp -d) && printf \"%s\\n\" \"public class Main { public static void main(String[] args) { System.out.println(3); } }\" > \"\$d/Main.java\" && javac \"\$d/Main.java\" && test \"\$(java -cp \"\$d\" Main)\" = 3 && rm -rf \"\$d\"'; sudo docker run --rm --network none --read-only --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit 64 --memory 256m --memory-swap 256m --cpus 0.5 --tmpfs /tmp:rw,noexec,nosuid,size=64m --tmpfs /workspace:rw,nosuid,size=64m,uid=1000,gid=1000,mode=700 --entrypoint sh atomm-lms-compiler-sandbox:latest -ec 'command -v javac && javac -version && command -v java && java -version && d=\$(mktemp -d /workspace/java-smoke.XXXXXX) && printf \"%s\\n\" \"public class Main { public static void main(String[] args) { System.out.println(3); } }\" > \"\$d/Main.java\" && javac \"\$d/Main.java\" && test \"\$(java -cp \"\$d\" Main)\" = 3 && rm -rf \"\$d\"'"
                echo "--> Worker $IP updated and both Java runtimes verified."
              done
            else
              echo "No active worker servers running currently."
            fi

            echo "============================================="
            echo "3. INVALIDATING CLOUDFRONT CACHE"
            echo "============================================="
            aws cloudfront create-invalidation --distribution-id E1AYTT6AU835YB --paths '/*' 2>/dev/null || true
            
            echo "============================================="
            echo "SUCCESS: ALL SERVERS DEPLOYED AUTOMATICALLY!"
            echo "============================================="
