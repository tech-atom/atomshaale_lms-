{% extends 'base.html' %}

{% block title %}Link Invalid{% endblock %}

{% block content %}
  <div class="alert alert-danger">
    <h2>Invalid or Expired Link</h2>
    <p>
      This verification link is no longer valid. 
      Please request a new verification email or contact your administrator.
    </p>
    <a href="{% url 'resend_verification_email' %}">Request a new verification email</a>
  </div>
{% endblock %}
