services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: gunicorn atomm_lms.wsgi:application --bind 0.0.0.0:8000 --workers ${WEB_WORKERS:-4} --threads ${WEB_THREADS:-2} --timeout 60 --access-logfile -
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

  celery-email:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: celery -A atomm_lms worker --loglevel=INFO --queues=email_queue --concurrency=${EMAIL_WORKERS:-2} --max-tasks-per-child=100
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  celery-compiler:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: celery -A atomm_lms worker --loglevel=INFO --queues=compiler_queue --concurrency=${COMPILER_WORKERS:-4} --max-tasks-per-child=100
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      compiler-sandbox:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  compiler-sandbox:
    build:
      context: ./Compiler/sandbox
      dockerfile: Dockerfile
    image: atomm-lms-compiler-sandbox:latest
    entrypoint: ["/bin/true"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
